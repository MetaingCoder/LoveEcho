<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story</title>
    <style>
        /* 1. 基础重置 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        a { text-decoration: none; color: inherit; }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #f0f2f5;
        }

        /* 2. 背景方案 */
        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 依然保留原有的背景图 */
            background: url('https://images.unsplash.com/photo-1516589174184-c685265162fb?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            z-index: -2;
        }

        .bg-mask {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: -1;
        }

        /* 3. 主体容器 */
        .scroll-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 100px;
        }

        /* 4. 通用卡片样式 */
        .glass-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 30px 20px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        /* 5. 头像区 */
        .profile-section { display: flex; justify-content: space-evenly; align-items: center; }
        .user-info img {
            width: 80px; height: 80px;
            border-radius: 50%; border: 3px solid #fff;
            object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .user-info p { margin-top: 12px; font-size: 15px; font-weight: 500; color: #333; letter-spacing: 1px; }
        .heart-center { font-size: 28px; color: #ff6b81; animation: pulse 2s infinite ease-in-out; }

        /* 6. 计时器 */
        .timer-title { font-size: 13px; color: #888; letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
        .timer-num { font-size: 32px; font-weight: 600; color: #222; margin: 0 4px; }

        /* 7. 状态与统计块 */
        .stats-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .stats-box { flex: 1; background: rgba(255, 255, 255, 0.5); padding: 15px; border-radius: 20px; text-align: left; }
        .stats-box .status-text { font-size: 18px; font-weight: bold; color: #333; display: block; }
        .stats-box .label { font-size: 10px; color: #999; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; display: block; }

        /* 8. 交互列表项 */
        .link-item { display: flex; align-items: center; padding: 16px 15px; border-bottom: 1px solid rgba(0,0,0,0.05); text-align: left; transition: background 0.2s; }
        .link-item:active { background: rgba(0,0,0,0.03); }
        .link-item:last-child { border-bottom: none; }
        .list-icon { width: 38px; height: 38px; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.03); }
        .list-text b { display: block; font-size: 15px; color: #333; margin-bottom: 2px; }
        .list-text span { font-size: 12px; color: #999; }
        .arrow-right { margin-left: auto; color: #ccc; font-size: 16px; }

        /* 底部按钮 */
        .code-button {
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 18px;
            padding: 12px;
            font-size: 13px;
            color: #666;
            font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="bg-fixed"></div>
    <div class="bg-mask"></div>

    <div class="scroll-wrapper">
        
        <div class="glass-card profile-section">
            <div class="user-info">
    <!-- 将 src 中的链接替换为 阿奇 的 QQ 号对应的 API 链接 -->
    <img src="https://q1.qlogo.cn/g?b=qq&nk=647065257&s=640" alt="Male">
    <p>阿奇</p>
</div>
<div class="heart-center">❤</div>
<div class="user-info">
    <!-- 将 src 中的链接替换为 灵灵 的 QQ 号对应的 API 链接 -->
    <img src="https://q1.qlogo.cn/g?b=qq&nk=3381293067&s=640" alt="Female">
    <p>灵灵</p>
</div>
        </div>

        <div class="glass-card">
            <div class="timer-title">相恋纪念 / LOVE ANNIVERSARY</div>
            <div class="timer-display" id="timer">加载中...</div>
        </div>

        <div class="glass-card" style="padding: 20px;">
            <div class="stats-row">
                <div class="stats-box">
                    <span class="status-text">😊 开心</span>
                    <span class="label">当前状态 / Status</span>
                </div>
                <div class="stats-box">
                    <span class="status-text" style="font-size: 20px;">99.9%</span>
                    <span class="label">安全运行 / Uptime</span>
                </div>
            </div>

            <div style="width: 100%; height: 1px; background: rgba(0,0,0,0.05); margin: 15px 0;"></div>

            <div style="text-align: left;">
                <a href="mailto:echo@kusteo.com" class="link-item">
                    <div class="list-icon">✉</div>
                    <div class="list-text"><b>联系我们</b><span>发送邮件交流 / Email</span></div>
                    <div class="arrow-right">→</div>
                </a>
                <a href="https://space.bilibili.com/3546965648345431" class="link-item">
                    <div class="list-icon">💬</div>
                    <div class="list-text"><b>哔哩哔哩</b><span>关注动态与更新</span></div>
                    <div class="arrow-right">→</div>
                </a>
            </div>

            <a href="https://github.com/MetaingCoder/LoveEcho" target="_blank" class="code-button">
                <span>{ }</span> 查看开发代码 / Source Code
            </a>
        </div>
    </div>

    <script>
        // 计时逻辑 (2025年5月5日)
        const startDate = new Date(2025, 4, 5, 0, 0, 0); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);
            const s = Math.floor((diff / 1000) % 60);

            document.getElementById('timer').innerHTML = `
                <div><span class="timer-num">${d}</span>天</div>
                <div style="margin-top:10px; font-size: 14px; color: #666;">
                    <span class="timer-num" style="font-size:20px">${h}</span>时 
                    <span class="timer-num" style="font-size:20px">${m}</span>分 
                    <span class="timer-num" style="font-size:20px">${s}</span>秒
                </div>
            `;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
